<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your SoundSwipe password</title>
  </head>
  <body style="margin: 0; padding: 0; background: #05070c;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: transparent;">Reset your SoundSwipe password securely.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width: 100%; background: radial-gradient(circle at top left, rgba(136, 103, 255, 0.28), transparent 30%), radial-gradient(circle at 86% 8%, rgba(97, 164, 255, 0.18), transparent 26%), #05070c;">
      <tr>
        <td align="center" style="padding: 34px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width: 100%; max-width: 640px;">
            <tr>
              <td align="center" style="padding: 0 0 18px;">
                <img src="https://soundswipe.us/soundswipe_logo3.png" width="210" alt="SoundSwipe" style="display: block; width: 210px; max-width: 72%; height: auto; border: 0;">
              </td>
            </tr>
            <tr>
              <td style="border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 28px; background: #10141d; overflow: hidden; box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="padding: 30px 30px 24px; background: linear-gradient(135deg, rgba(136, 103, 255, 0.18), rgba(97, 164, 255, 0.08));">
                      <div style="font-family: Arial, Helvetica, sans-serif; color: #bca8ff; font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">Account security</div>
                      <h1 style="margin: 12px 0 0; font-family: Arial, Helvetica, sans-serif; color: #f5f7fb; font-size: 30px; line-height: 1.12; letter-spacing: -0.03em;">Reset your password.</h1>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 28px 30px 30px;">
                      <p style="margin: 0; font-family: Arial, Helvetica, sans-serif; color: #c4cadd; font-size: 16px; line-height: 1.65;">Use the secure button below to choose a new SoundSwipe password.</p>
                      <div style="padding: 24px 0 4px;">
                        <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 15px 22px; border-radius: 999px; background: linear-gradient(135deg, #8867ff 0%, #61a4ff 100%); color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; text-decoration: none; box-shadow: 0 18px 34px rgba(97, 164, 255, 0.24);">Reset Password</a>
                      </div>
                      <p style="margin: 22px 0 0; font-family: Arial, Helvetica, sans-serif; color: #9ea8ba; font-size: 14px; line-height: 1.6;">If you did not request this, you can ignore this email and your password will stay the same.</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 20px 18px 0; font-family: Arial, Helvetica, sans-serif; color: #7d8799; font-size: 12px; line-height: 1.6;">© 2026 SoundSwipe. All rights reserved.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
